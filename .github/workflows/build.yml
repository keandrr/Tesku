name: Build classes2.dex
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          set -e
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          JAR=$(ls -d $SDK/platforms/android-* | sort -V | tail -1)/android.jar
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          mkdir -p out/classes
          javac -source 8 -target 8 -classpath "$JAR" -d out/classes org/gbarecomp/SaveImportActivity.java
          $BT/d8 --min-api 28 --lib "$JAR" --output out $(find out/classes -name '*.class')
          mv out/classes.dex out/classes2.dex
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: classes2-dex
          path: out/classes2.dex
